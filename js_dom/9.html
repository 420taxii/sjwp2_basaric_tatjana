<!doctype html>
<html lang="hr">
  <body>
    <p id="odlomak">odlomak</p>

    <button onclick="sakrijPrikazi()">Sakrij odlomak</button>

    <script>
      function sakrijPrikazi() {
        let odlomak = document.getElementById("odlomak");
        let gumb = document.querySelector("button");

        if (odlomak.style.display !== "none") {
          odlomak.style.display = "none";
          gumb.textContent = "prikazi";
        } else {
          odlomak.style.display = "block";
          gumb.textContent = "sakrij";
        }
      }
    </script>
  </body>
</html>
